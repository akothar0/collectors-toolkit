<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Collectors Toolkit · Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #f0eee9;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    * { box-sizing: border-box; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="scanner.jsx"></script>

  <script type="text/babel" data-presets="react">
    const SCANNER_TWEAKS = /*EDITMODE-BEGIN*/{
      "phase": "idle",
      "showHistory": true,
      "showProvenance": true
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(SCANNER_TWEAKS);
      return (
        <>
          <DesignCanvas>
            <DCSection
              id="scanner"
              title="Scanner · slab capture → cert lookup → save"
              subtitle="Editorial A base with bold-from-B accents (slab-as-hero result, provenance trace). Cycle states with the Tweaks panel — phase = idle / scanning / result / manual. Or click 'Run demo scan' on the board to play it live.">
              <DCArtboard id="s-desktop" label="Scanner — Desktop" width={1320} height={1820}>
                <ScannerDesktop initialPhase={t.phase}/>
              </DCArtboard>
              <DCArtboard id="s-mobile" label="Scanner — Mobile" width={420} height={900}>
                <div style={{display:'flex', alignItems:'center', justifyContent:'center', height:'100%'}}>
                  <ScannerMobile initialPhase={t.phase}/>
                </div>
              </DCArtboard>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel title="Scanner tweaks">
            <TweakSection label="Demo state">
              <TweakSelect
                label="Phase"
                value={t.phase}
                onChange={v => setTweak('phase', v)}
                options={[
                  { label: 'Idle · awaiting image',     value: 'idle' },
                  { label: 'Scanning · OCR running',    value: 'scanning' },
                  { label: 'Result · cert matched',     value: 'result' },
                  { label: 'Manual · OCR failed',       value: 'manual' },
                ]}
              />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
